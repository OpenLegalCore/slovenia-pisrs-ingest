name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_DB: pisrs_test_payloads
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          python -m pip install uv==0.5.9
          uv sync --locked --all-extras
      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Offline tests
        run: uv run pytest
      - name: Isolated PostgreSQL payload tests
        env:
          PISRS_TEST_DATABASE_DSN: postgresql://postgres:postgres@localhost:5432/pisrs_test_payloads
        run: uv run pytest tests/test_payload_materialization.py -k test_pg_
      - name: Build distributions
        run: uv run python -m build --no-isolation
