[build-system]
requires = ["setuptools>=75,<90", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openlegalcore-pisrs-g3"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["requests>=2.32,<3", "psycopg[binary]>=3.3,<4"]
description = "PIKI PISRS PostgreSQL source-ingest G3, fixed G2 contract"

[project.scripts]
pisrs-g3 = "pisrs_g3.cli:main"

[tool.setuptools]
packages = ["pisrs_g3"]

[tool.setuptools.package-data]
pisrs_g3 = ["migrations/*.sql"]
