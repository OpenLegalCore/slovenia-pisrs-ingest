[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pisrs-ingest"
version = "0.1.0"
description = "A source-available ingestion pipeline for Slovenian legislation from PISRS into PostgreSQL and Qdrant."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [{ name = "Rajko Majcen" }]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "psycopg[binary]>=3.2,<4",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
pisrs-ingest = "pisrs_ingest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pisrs_ingest"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
